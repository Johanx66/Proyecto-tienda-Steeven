name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificar formato (Prettier)
        run: npm run format:check

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificar formato (Prettier)
        run: npm run format:check

      - name: Build de producción (Vite)
        run: npm run build

  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Obtener credenciales temporales de AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Subir el código versionado a S3
        env:
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/tienda.tar.gz" HEAD
          aws s3 cp "$RUNNER_TEMP/tienda.tar.gz" "s3://$DEPLOY_BUCKET/releases/${GITHUB_SHA}.tar.gz"

      - name: Iniciar despliegue en EC2 mediante Systems Manager
        env:
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          bucket = os.environ["DEPLOY_BUCKET"]
          instance = os.environ["EC2_INSTANCE_ID"]
          sha = os.environ["GITHUB_SHA"]
          commands = [
              "set -eu",
              f"aws s3 cp s3://{bucket}/releases/{sha}.tar.gz /tmp/tienda-release.tar.gz",
              "mkdir -p /home/ubuntu/tienda",
              "tar -xzf /tmp/tienda-release.tar.gz -C /home/ubuntu/tienda",
              "cd /home/ubuntu/tienda && docker compose up -d --build",
              "rm -f /tmp/tienda-release.tar.gz",
          ]
          pathlib.Path(os.environ["RUNNER_TEMP"], "ssm-parameters.json").write_text(
              json.dumps({"commands": commands}), encoding="utf-8"
          )
          PY

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)

          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)
            case "$status" in
              Success) echo "Despliegue completado: $GITHUB_SHA"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query '{Status:Status,Output:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Tiempo de espera agotado. CommandId: $command_id"
          exit 1
