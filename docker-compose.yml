services:
  postgres:
    image: postgres:16-alpine
    container_name: tienda_frescos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tienda_frescos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_frescos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: tienda_frescos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tienda_frescos
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: cambia_esta_clave_secreta_en_produccion_1234567890
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:5000}
      MAIL_MOCK: ${MAIL_MOCK:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Frutería Web <no-reply@fruteria.local>}
      VERIFICATION_TOKEN_TTL_MINUTES: ${VERIFICATION_TOKEN_TTL_MINUTES:-30}
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: tienda_frescos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
